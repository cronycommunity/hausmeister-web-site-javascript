server {
    listen       80;
    server_name  bbau-bauprofis.de www.bbau-bauprofis.de localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # ---------------------------------------------------------------
    # Automatische Referenz-Galerie
    # Jeder Unterordner unter /images/referenzen/ wird automatisch
    # als eigenes Album auf der Webseite angezeigt.
    # Neues Projekt = einfach neuen Ordner mit Bildern ablegen.
    # ---------------------------------------------------------------
    location /images/referenzen/ {
        autoindex on;
        autoindex_format json;
        autoindex_localtime on;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Referenzbilder nur kurz cachen - so wirkt ein neuer Build sofort,
    # auch wenn ein Bild unter gleichem Dateinamen ausgetauscht wurde.
    location ~* ^/images/referenzen/.*\.(png|jpe?g|gif|webp|avif)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Uebrige statische Assets laenger cachen
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
}
